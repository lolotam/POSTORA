name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        # `tsc --noEmit` alone is a no-op on the solution-style root tsconfig
        # (files: [] + references) and exits 0 even on broken code. `-b`
        # actually checks the referenced projects.
        run: npx tsc -b --noEmit

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      # `bun test` is Bun's own runner: it ignores vitest.config, the jsdom
      # environment, src/test/setup.ts and the `@` alias, and it walks files the
      # vitest `include` pattern excludes (such as the Deno edge-function tests).
      # `bun run test` executes the package.json script, i.e. `vitest run`.
      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: always()
        # Artifact storage quota exhaustion must never fail CI; results are diagnostics only.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  edge-functions:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The 70+ Deno tests under supabase/functions/** were outside every CI
      # gate until this job existed: vite.config.ts sets the vitest `include` to
      # src/**, so `bun run test` never walked them. They ran only on a
      # developer's machine, where a gitignored deno.lock happened to make them
      # resolve.
      #
      # --node-modules-dir=auto is load-bearing, not a style choice: a fresh
      # checkout has neither deno.lock nor node_modules, and
      # ai-knowledge-excel-worker/index.test.ts imports `npm:xlsx@0.18.5` while
      # package.json pins the SheetJS tarball at 0.20.3. Without it, module
      # resolution fails before a single test runs.
      #
      # Tests that fetch() a deployed function register as *ignored* here (see
      # _shared/integrationTestGuard.ts) because SUPABASE_URL is unset. They are
      # reported in the summary, not silently dropped.
      - name: Run edge function tests
        run: >-
          deno test
          --allow-env --allow-net --allow-read --allow-write
          --no-check --node-modules-dir=auto
          supabase/functions/

  contract-drift:
    name: Partner API contract drift
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # docs/api/openapi.yaml is the published Partner API contract. This job
      # compares it against the committed baseline beside it and fails on a
      # field removal, a type narrowing, an enum removal or a required-field
      # addition -- the four changes that break a partner's integration at
      # runtime rather than at build time.
      #
      # It is NOT a schema validator, and validity is not what it checks. A
      # well-formed document can still be a different contract than it was
      # yesterday. Bumping `info.version` deliberately does not satisfy it
      # either: the gate never reads that field, because a version bump is a
      # keystroke and this gate exists to require a decision.
      #
      # A breaking change lands by adding its finding id to
      # docs/api/accepted-breaking-changes.txt, which authorises that one
      # change and nothing else. Additive changes -- a new optional field, a
      # new enum value -- pass silently and on purpose; a gate that fires on
      # safe changes is a gate someone deletes.
      #
      # Only --allow-read: this gate reads two files and needs nothing else.
      - name: Check contract drift
        run: deno run --allow-read scripts/check-openapi-drift.ts

      # The Postman collection is DERIVED from the contract (PRD §33). The
      # committed JSON must be byte-identical to what the generator produces
      # from the current document, or a partner imports a collection that
      # disagrees with the contract it claims to mirror. This test also
      # refuses any real-looking credential in the generated files.
      - name: Check the Postman collection is regenerated
        run: >-
          deno test --allow-env --allow-read --no-check --node-modules-dir=auto
          scripts/generate-postman.test.ts

      # docs/developer/AGENT-CONTEXT.md is the one file a partner hands to the
      # agent implementing their integration. It is derived from the developer
      # pages, the route and policy tables and the contract; a committed bundle
      # that is not what the generator produces is what that agent would
      # implement against, and be wrong.
      - name: Check the agent hand-off bundle is regenerated
        run: >-
          deno test --allow-env --allow-read --no-check --node-modules-dir=auto
          scripts/generate-agent-context.test.ts

  db-harness:
    name: Postgres integration harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repo is mounted into the container because the harness RUNS
      # INSIDE it. That is not a convenience: this image's pg_hba closes
      # connections from privileged roles arriving over the Docker bridge, so
      # `psql -h localhost` from the runner to the published port fails with
      # "server closed the connection unexpectedly", while the identical
      # connection from inside the container succeeds. Verified both ways on
      # 2026-08-30. Running in-container also means the runner needs no psql.
      #
      # `docker run` rather than a services: block because the harness must be
      # able to test migrations that schedule pg_cron jobs, and pg_cron refuses
      # CREATE EXTENSION in any database except the one named by
      # cron.database_name -- a postmaster-level setting that can only be given
      # on the server command line. Service containers cannot pass one.
      - name: Start supabase/postgres container
        run: >-
          docker run -d --name pg-harness
          -v "$GITHUB_WORKSPACE":/repo
          -e POSTGRES_PASSWORD=postgres
          -p 3000:3000
          supabase/postgres:17.6.1.158
          -c cron.database_name=partner_api_harness
          -c shared_preload_libraries=pg_cron,pg_net

      # Wait on the container HEALTHCHECK, not on a query.
      #
      # Neither pg_isready nor "can I run select 1" works here, and both were
      # tried. The entrypoint runs a TEMPORARY server while it applies the
      # image's own init migrations, and that server answers on the unix
      # socket -- so an in-container probe reports ready in ~4s, the harness
      # starts against a server that is then shut down, and it dies with
      # "cannot connect". The image's own healthcheck is the only signal that
      # tracks the FINAL postmaster.
      #
      # On a cold runner (image pull + initdb + those migrations) this
      # legitimately takes minutes: the first version of this job died at a
      # 120s budget with the log ending on "PostgreSQL init process complete;
      # ready for start up".
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 150); do
            status="$(docker inspect -f '{{.State.Health.Status}}' pg-harness 2>/dev/null || echo missing)"
            case "$status" in
              healthy)
                echo "container healthy"
                exit 0 ;;
              unhealthy|missing)
                echo "container is $status" >&2
                docker logs --tail 50 pg-harness
                exit 1 ;;
            esac
            sleep 2
          done
          echo "postgres never became healthy within 300s" >&2
          docker logs --tail 50 pg-harness
          exit 1

      # Connect as supabase_admin, not `postgres`: in this image `postgres` is
      # deliberately not a superuser and gets "permission denied for schema
      # auth" the moment the suites touch auth.users. supabase_admin is the
      # bootstrap superuser and owns the platform schemas.
      #
      # No password in the URL: from inside the container this is a local
      # connection, which the image trusts. Nothing credential-bearing is
      # printed either way -- the harness redacts its own URLs.
      - name: Run database harness
        run: >-
          docker exec -e HARNESS_DB_NAME=partner_api_harness pg-harness
          bash /repo/scripts/db-harness.sh
          'postgres://supabase_admin@localhost:5432/postgres'

      # The end-to-end chain test (PRD §46.8, plan 10.8) runs the real /v1
      # handlers against the harness database the suites just proved, through
      # PostgREST -- so the idempotency claim, the quota reservation, the
      # dispatch intent, the webhook outbox and the reconciliation are the
      # real SQL, not a stub of it. The provider and the partner's webhook
      # endpoint are the only stubs, at the fetch boundary.
      #
      # PostgREST shares pg-harness's network namespace: from there Postgres is
      # localhost, which pg_hba trusts (the bridge does not -- see the
      # container note above), and pg-harness's published port 3000 is how the
      # runner reaches it. The JWT secret is a throwaway for this database
      # only; nothing it signs is accepted anywhere else.
      - name: Start PostgREST against the harness database
        run: |
          docker run -d --name pgrst-harness --network container:pg-harness \
            -e PGRST_DB_URI='postgres://supabase_admin@localhost:5432/partner_api_harness' \
            -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_JWT_SECRET='harness-jwt-secret-at-least-32-characters-long' \
            postgrest/postgrest:v12.2.3
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:3000/; then
              echo "PostgREST is serving"; exit 0
            fi
            sleep 2
          done
          echo "PostgREST never became ready" >&2
          docker logs --tail 50 pgrst-harness
          exit 1

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The tests register as ignored when the two variables are unset, so a
      # renamed variable would turn this step green with nothing run. The
      # grep makes "ignored" a failure here, where they must run.
      - name: Run the end-to-end chain test
        env:
          PARTNER_E2E_POSTGREST_URL: http://localhost:3000
          PARTNER_E2E_JWT_SECRET: harness-jwt-secret-at-least-32-characters-long
        run: |
          set -o pipefail
          deno test --allow-env --allow-net --allow-read --allow-write \
            --no-check --node-modules-dir=auto \
            supabase/functions/partner-api/e2e/ 2>&1 | tee e2e.log
          if grep -q "ignored" e2e.log; then
            echo "E2E tests were ignored: the environment did not reach them" >&2
            exit 1
          fi

      - name: PostgREST logs on failure
        if: failure()
        run: docker logs --tail 100 pgrst-harness || true

      - name: Postgres logs on failure
        if: failure()
        run: docker logs --tail 100 pg-harness

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7
