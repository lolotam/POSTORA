# =============================================================================
# Reference snippet — Supabase edge-functions service env configuration.
# =============================================================================
# The full Supabase docker-compose.yml lives on the production Dokploy server at
# /etc/dokploy/compose/postorasupabase-supabase-j8axyh/code/docker-compose.yml.
# This file is NOT used directly at runtime. It documents the REQUIRED shape of
# the `functions` service env configuration so that secrets in .env reach the
# edge-functions container. The CI drift detector (npm run check:edge-env)
# validates this snippet.
#
# KEY PRINCIPLE: Docker Compose .env only does ${VAR} interpolation INTO the
# compose file. To inject variables into the container you need EITHER env_file
# OR explicit environment mappings. We use env_file (injects everything) with
# explicit environment overrides for values that must differ inside the Docker
# network (Docker Compose precedence: environment > env_file).
#
# See docs/EDGE_RUNTIME_ENV_RUNBOOK.md.
# =============================================================================
functions:
  # Injects ALL .env variables into the container automatically.
  # This is the permanent fix for the "secret not configured" regressions.
  env_file:
    - ./.env
  environment:
    # Explicit overrides — these take precedence over env_file values.
    # SUPABASE_URL must point to the internal Kong gateway, NOT the public URL.
    JWT_SECRET: ${JWT_SECRET}
    SUPABASE_URL: http://kong:8000
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    SUPABASE_DB_URL: postgresql://postgres:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    VERIFY_JWT: ${FUNCTIONS_VERIFY_JWT}
