name: Deploy Supabase Edge Functions

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/**"
      - ".github/workflows/deploy-edge-functions.yml"
  workflow_dispatch:

# Prevent overlapping deploys if two pushes land close together.
concurrency:
  group: deploy-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Sync Edge Functions to Contabo
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Deploy Edge Functions via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          # 60s command timeout is enough for git fetch + rsync + restart
          command_timeout: 5m
          script_stop: true
          script: |
            set -euo pipefail
            echo "== Postora Edge Functions deploy =="
            echo "Trigger: ${{ github.event_name }}  Ref: ${{ github.ref }}  SHA: ${{ github.sha }}"

            VOL="/etc/dokploy/compose/postorasupabase-supabase-j8axyh/files/volumes/functions"
            STACK="/etc/dokploy/compose/postorasupabase-supabase-j8axyh/code"
            RUNTIME="/root/postora-runtime"
            TMP_SYNC="/tmp/postora-functions-sync"

            if [ ! -d "$RUNTIME/.git" ]; then
              echo "::error::Runtime checkout not found at $RUNTIME — expected git@github.com:lolotam/POSTORA.git with deploy key postora_edge_deploy_ed25519"
              exit 1
            fi
            if [ ! -d "$VOL" ]; then
              echo "::error::Functions volume not found at $VOL"
              exit 1
            fi
            if [ ! -d "$STACK" ]; then
              echo "::error::Stack dir not found at $STACK"
              exit 1
            fi

            echo "--- Fetching origin/main into $RUNTIME ---"
            cd "$RUNTIME"
            # core.sshCommand is already wired to ~/.ssh/postora_edge_deploy_ed25519 (read-only deploy key)
            git fetch origin "+refs/heads/main:refs/remotes/origin/main" --prune

            # Resolve the exact SHA being deployed (must be origin/main after fetch, not local HEAD)
            DEPLOY_SHA="$(git rev-parse refs/remotes/origin/main)"
            echo "Deploying SHA: $DEPLOY_SHA  (trigger SHA: ${{ github.sha }})"

            echo "--- Syncing supabase/functions/ -> $VOL (atomic rsync) ---"
            rm -rf "$TMP_SYNC"
            mkdir -p "$TMP_SYNC"
            git archive "refs/remotes/origin/main" supabase/functions | tar -x -C "$TMP_SYNC"

            # --delete keeps volume in sync (removes functions deleted from git).
            # Keep the untracked `main` service (supabase/edge-runtime --main-service) — not in git, but required for boot.
            rsync -av --delete --exclude "main" "$TMP_SYNC/supabase/functions/" "$VOL/"

            echo "--- SHA256 verification (first 20 files, best-effort) ---"
            # Files written via git archive are always LF, no CRLF normalisation needed.
            # Verification is best-effort — never fail the deploy.
            (
              set +e
              set +o pipefail
              FAILED=0
              VERIFY_LIST="$(find "$VOL" -type f 2>/dev/null | head -n 20 || true)"
              for f in $VERIFY_LIST; do
                [ -z "$f" ] && continue
                # handle paths with spaces by using proper quoting
                rel="${f#$VOL/}"
                git_hash="$(git show "refs/remotes/origin/main:supabase/functions/$rel" 2>/dev/null | sha256sum 2>/dev/null | cut -d' ' -f1 || echo MISSING_IN_GIT)"
                vol_hash="$(sha256sum "$f" 2>/dev/null | cut -d' ' -f1 || echo MISSING_VOL)"
                if [ "$git_hash" != "$vol_hash" ] && [ "$git_hash" != "MISSING_IN_GIT" ] && [ "$vol_hash" != "MISSING_VOL" ]; then
                  echo "::warning::Hash mismatch for $rel  git=$git_hash  vol=$vol_hash"
                  FAILED=1
                else
                  echo "OK $rel  $vol_hash"
                fi
              done
              if [ "$FAILED" -eq 1 ]; then
                echo "::warning::One or more hash checks failed — see warnings above (continuing to restart)"
              fi
              echo "Total files in volume: $(find "$VOL" -type f 2>/dev/null | wc -l || echo 0)"
              echo "Total files in git (supabase/functions): $(find "$TMP_SYNC/supabase/functions" -type f 2>/dev/null | wc -l || echo 0)"
            ) || true

            echo "--- Restarting functions service (bind-mount reload) ---"
            # Per docs/runbooks/deploy-edge-function.md: `restart` reloads the bind mount.
            # `up -d --no-deps` is a no-op when compose config is unchanged and would silently serve stale code.
            cd "$STACK"
            docker compose restart functions

            # ai-knowledge-excel-worker is a second long-lived service that also mounts _shared.
            # Restart it only when the worker or a shared module it imports changed.
            # Use pipefail-safe check: grep -q closes pipe early (SIGPIPE 141) under pipefail.
            set +o pipefail
            if git -C "$RUNTIME" diff --name-only "HEAD~1..refs/remotes/origin/main" 2>/dev/null | grep -qE "supabase/functions/_shared/|supabase/functions/ai-knowledge-excel-worker/"; then
              set -o pipefail
              echo "Detected _shared or ai-knowledge-excel-worker change — restarting ai-knowledge-excel-worker as well"
              docker compose restart ai-knowledge-excel-worker || echo "::warning::ai-knowledge-excel-worker restart failed or service not present"
            else
              set -o pipefail
              echo "No _shared/worker change detected — skipping ai-knowledge-excel-worker restart"
            fi

            echo "--- Post-restart checks ---"
            sleep 4
            docker compose ps functions || true
            echo "--- Recent functions logs (tail 60) ---"
            set +o pipefail
            docker compose logs --tail=60 functions | tail -n 60 || true
            set -o pipefail

            echo "--- Healthcheck: get-public-config (expect 200) ---"
            # Public endpoint, no auth needed. Use --max-time 15 and retry 3x.
            HEALTH_URL="https://api.postora.cloud/functions/v1/get-public-config"
            for i in 1 2 3; do
              HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$HEALTH_URL" || echo 000)"
              echo "Attempt $i: $HEALTH_URL -> $HTTP_CODE"
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Healthcheck passed"
                break
              fi
              if [ "$i" -eq 3 ]; then
                echo "::error::Healthcheck failed after 3 attempts (last code $HTTP_CODE)"
                docker compose logs --tail=100 functions || true
                exit 1
              fi
              sleep 5
            done

            echo "--- CORS preflight check for an OAuth function (expect 200) ---"
            curl -s -o /dev/null -w 'facebook-oauth OPTIONS -> %{http_code}\n' --max-time 10 -X OPTIONS "https://api.postora.cloud/functions/v1/facebook-oauth" || true

            echo "Cleaning up $TMP_SYNC"
            rm -rf "$TMP_SYNC"

            echo "== Deploy complete =="
