name: Publish to npm
on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag or ref to publish (defaults to the branch this is run from)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
      # Without this the run reaches `npm publish` and dies on an opaque auth
      # error; NPM_TOKEN has been unset on this repo, so fail loudly instead.
      - name: Check publish credentials
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error::NPM_TOKEN is not configured on this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
