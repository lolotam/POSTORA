name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        # `tsc --noEmit` alone is a no-op on the solution-style root tsconfig
        # (files: [] + references) and exits 0 even on broken code. `-b`
        # actually checks the referenced projects.
        run: npx tsc -b --noEmit

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      # `bun test` is Bun's own runner: it ignores vitest.config, the jsdom
      # environment, src/test/setup.ts and the `@` alias, and it walks files the
      # vitest `include` pattern excludes (such as the Deno edge-function tests).
      # `bun run test` executes the package.json script, i.e. `vitest run`.
      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: always()
        # Artifact storage quota exhaustion must never fail CI; results are diagnostics only.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  edge-functions:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The 70+ Deno tests under supabase/functions/** were outside every CI
      # gate until this job existed: vite.config.ts sets the vitest `include` to
      # src/**, so `bun run test` never walked them. They ran only on a
      # developer's machine, where a gitignored deno.lock happened to make them
      # resolve.
      #
      # --node-modules-dir=auto is load-bearing, not a style choice: a fresh
      # checkout has neither deno.lock nor node_modules, and
      # ai-knowledge-excel-worker/index.test.ts imports `npm:xlsx@0.18.5` while
      # package.json pins the SheetJS tarball at 0.20.3. Without it, module
      # resolution fails before a single test runs.
      #
      # Tests that fetch() a deployed function register as *ignored* here (see
      # _shared/integrationTestGuard.ts) because SUPABASE_URL is unset. They are
      # reported in the summary, not silently dropped.
      - name: Run edge function tests
        run: >-
          deno test
          --allow-env --allow-net --allow-read --allow-write
          --no-check --node-modules-dir=auto
          supabase/functions/

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7
