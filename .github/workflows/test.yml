name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        # `tsc --noEmit` alone is a no-op on the solution-style root tsconfig
        # (files: [] + references) and exits 0 even on broken code. `-b`
        # actually checks the referenced projects.
        run: npx tsc -b --noEmit

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      # `bun test` is Bun's own runner: it ignores vitest.config, the jsdom
      # environment, src/test/setup.ts and the `@` alias, and it walks files the
      # vitest `include` pattern excludes (such as the Deno edge-function tests).
      # `bun run test` executes the package.json script, i.e. `vitest run`.
      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: always()
        # Artifact storage quota exhaustion must never fail CI; results are diagnostics only.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  edge-functions:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The 70+ Deno tests under supabase/functions/** were outside every CI
      # gate until this job existed: vite.config.ts sets the vitest `include` to
      # src/**, so `bun run test` never walked them. They ran only on a
      # developer's machine, where a gitignored deno.lock happened to make them
      # resolve.
      #
      # --node-modules-dir=auto is load-bearing, not a style choice: a fresh
      # checkout has neither deno.lock nor node_modules, and
      # ai-knowledge-excel-worker/index.test.ts imports `npm:xlsx@0.18.5` while
      # package.json pins the SheetJS tarball at 0.20.3. Without it, module
      # resolution fails before a single test runs.
      #
      # Tests that fetch() a deployed function register as *ignored* here (see
      # _shared/integrationTestGuard.ts) because SUPABASE_URL is unset. They are
      # reported in the summary, not silently dropped.
      - name: Run edge function tests
        run: >-
          deno test
          --allow-env --allow-net --allow-read --allow-write
          --no-check --node-modules-dir=auto
          supabase/functions/

  db-harness:
    name: Postgres integration harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The repo is mounted into the container because the harness RUNS
      # INSIDE it. That is not a convenience: this image's pg_hba closes
      # connections from privileged roles arriving over the Docker bridge, so
      # `psql -h localhost` from the runner to the published port fails with
      # "server closed the connection unexpectedly", while the identical
      # connection from inside the container succeeds. Verified both ways on
      # 2026-08-30. Running in-container also means the runner needs no psql.
      #
      # `docker run` rather than a services: block because the harness must be
      # able to test migrations that schedule pg_cron jobs, and pg_cron refuses
      # CREATE EXTENSION in any database except the one named by
      # cron.database_name -- a postmaster-level setting that can only be given
      # on the server command line. Service containers cannot pass one.
      - name: Start supabase/postgres container
        run: >-
          docker run -d --name pg-harness
          -v "$GITHUB_WORKSPACE":/repo
          -e POSTGRES_PASSWORD=postgres
          supabase/postgres:17.6.1.158
          -c cron.database_name=partner_api_harness
          -c shared_preload_libraries=pg_cron,pg_net

      # Wait on the container HEALTHCHECK, not on a query.
      #
      # Neither pg_isready nor "can I run select 1" works here, and both were
      # tried. The entrypoint runs a TEMPORARY server while it applies the
      # image's own init migrations, and that server answers on the unix
      # socket -- so an in-container probe reports ready in ~4s, the harness
      # starts against a server that is then shut down, and it dies with
      # "cannot connect". The image's own healthcheck is the only signal that
      # tracks the FINAL postmaster.
      #
      # On a cold runner (image pull + initdb + those migrations) this
      # legitimately takes minutes: the first version of this job died at a
      # 120s budget with the log ending on "PostgreSQL init process complete;
      # ready for start up".
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 150); do
            status="$(docker inspect -f '{{.State.Health.Status}}' pg-harness 2>/dev/null || echo missing)"
            case "$status" in
              healthy)
                echo "container healthy"
                exit 0 ;;
              unhealthy|missing)
                echo "container is $status" >&2
                docker logs --tail 50 pg-harness
                exit 1 ;;
            esac
            sleep 2
          done
          echo "postgres never became healthy within 300s" >&2
          docker logs --tail 50 pg-harness
          exit 1

      # Connect as supabase_admin, not `postgres`: in this image `postgres` is
      # deliberately not a superuser and gets "permission denied for schema
      # auth" the moment the suites touch auth.users. supabase_admin is the
      # bootstrap superuser and owns the platform schemas.
      #
      # No password in the URL: from inside the container this is a local
      # connection, which the image trusts. Nothing credential-bearing is
      # printed either way -- the harness redacts its own URLs.
      - name: Run database harness
        run: >-
          docker exec -e HARNESS_DB_NAME=partner_api_harness pg-harness
          bash /repo/scripts/db-harness.sh
          'postgres://supabase_admin@localhost:5432/postgres'

      - name: Postgres logs on failure
        if: failure()
        run: docker logs --tail 100 pg-harness

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7
