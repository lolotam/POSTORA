name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        # `tsc --noEmit` alone is a no-op on the solution-style root tsconfig
        # (files: [] + references) and exits 0 even on broken code. `-b`
        # actually checks the referenced projects.
        run: npx tsc -b --noEmit

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      # `bun test` is Bun's own runner: it ignores vitest.config, the jsdom
      # environment, src/test/setup.ts and the `@` alias, and it walks files the
      # vitest `include` pattern excludes (such as the Deno edge-function tests).
      # `bun run test` executes the package.json script, i.e. `vitest run`.
      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: always()
        # Artifact storage quota exhaustion must never fail CI; results are diagnostics only.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  edge-functions:
    name: Edge function tests (Deno)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # The 70+ Deno tests under supabase/functions/** were outside every CI
      # gate until this job existed: vite.config.ts sets the vitest `include` to
      # src/**, so `bun run test` never walked them. They ran only on a
      # developer's machine, where a gitignored deno.lock happened to make them
      # resolve.
      #
      # --node-modules-dir=auto is load-bearing, not a style choice: a fresh
      # checkout has neither deno.lock nor node_modules, and
      # ai-knowledge-excel-worker/index.test.ts imports `npm:xlsx@0.18.5` while
      # package.json pins the SheetJS tarball at 0.20.3. Without it, module
      # resolution fails before a single test runs.
      #
      # Tests that fetch() a deployed function register as *ignored* here (see
      # _shared/integrationTestGuard.ts) because SUPABASE_URL is unset. They are
      # reported in the summary, not silently dropped.
      - name: Run edge function tests
        run: >-
          deno test
          --allow-env --allow-net --allow-read --allow-write
          --no-check --node-modules-dir=auto
          supabase/functions/

  db-harness:
    name: Postgres integration harness
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Started with `docker run` instead of a `services:` block on purpose:
      # the harness must be able to test migrations that schedule pg_cron
      # jobs, and pg_cron refuses CREATE EXTENSION in any database except
      # the one named by cron.database_name — a postmaster-level setting
      # that can only be set on the server command line at start. GitHub
      # Actions service containers cannot pass a container command, so
      # these flags are impossible to express there. The pinned image is
      # the one this harness was validated against (pg_cron, pg_net,
      # vector, pgcrypto and pgTAP binaries all present).
      - name: Start supabase/postgres container
        run: >-
          docker run -d --name pg-harness -p 5432:5432
          -e POSTGRES_PASSWORD=postgres
          supabase/postgres:17.6.1.158
          -c cron.database_name=partner_api_harness
          -c shared_preload_libraries=pg_cron,pg_net

      - name: Install psql client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      # Two things this loop learned the hard way on a real runner:
      #
      #   * 120s was not enough. This image runs its own init migrations on
      #     first boot, and on a cold runner (image pull + initdb + those
      #     migrations) it ran past the old 60x2s budget -- the failing job's
      #     log ended on "PostgreSQL init process complete; ready for start
      #     up", i.e. it became ready moments after we gave up. 5 minutes.
      #
      #   * pg_isready is the wrong probe. The entrypoint runs a TEMPORARY
      #     server during init, so a readiness check can pass against a
      #     server that is about to be shut down and restarted. Probing with
      #     a real query over TCP, as the harness itself connects, is what
      #     actually indicates the final server is up.
      - name: Wait for Postgres
        run: |
          for _ in $(seq 1 150); do
            if psql "postgres://supabase_admin@localhost:5432/postgres"                  -Atqc 'select 1' >/dev/null 2>&1; then
              echo "postgres accepted a real query"
              exit 0
            fi
            sleep 2
          done
          echo "postgres never became ready within 300s" >&2
          docker logs pg-harness
          exit 1

      # Connect as supabase_admin, not `postgres`: in this image `postgres`
      # is deliberately not a superuser and gets "permission denied for
      # schema auth" the moment the suites touch auth.users. supabase_admin
      # is the bootstrap superuser and owns the platform schemas.
      - name: Run database harness
        run: >-
          bash scripts/db-harness.sh
          'postgres://supabase_admin:postgres@localhost:5432/postgres'
        env:
          HARNESS_DB_NAME: partner_api_harness

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7
