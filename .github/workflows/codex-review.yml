name: Codex review

# A second reviewer on every pull request, so review coverage does not depend on a
# third-party bot staying inside its plan. CodeRabbit exhausted the org's free quota on
# 2026-08-28 and silently reviewed nothing; this job runs on our own credential.
#
# Advisory only. It never gates a merge: a review that cannot run must not hold up a fix.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A push mid-review makes the running review stale, so cancel it rather than post twice.
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check for the Codex credential
        id: credential
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OPENAI_API_KEY is not set; skipping the Codex review."
          fi

      - name: Checkout the pull request
        if: steps.credential.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          # `codex exec review --base` diffs against the base branch, which needs both
          # sides of the merge base in the local clone.
          fetch-depth: 0

      - name: Fetch the base branch
        if: steps.credential.outputs.present == 'true'
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Setup Node.js
        if: steps.credential.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install the Codex CLI
        if: steps.credential.outputs.present == 'true'
        run: npm install -g @openai/codex@0.150.0

      - name: Review the changes
        if: steps.credential.outputs.present == 'true'
        id: codex
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          codex exec review \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --title "${{ github.event.pull_request.title }}" \
            --output-last-message review.md \
            - <<'BRIEF'
          Review this pull request as a senior engineer on Postora.

          Read ARCHITECTURE.md first and hold the diff to the layering, Edge Function shape
          and security rules it defines. CLAUDE.md carries the repo's task rules.

          Report only defects you can name a concrete failure for: wrong behaviour, a
          security or tenancy hole (this codebase runs Edge Functions under the service role,
          so isolation must be structural rather than policy-based), a broken contract
          between two call sites, or a test that asserts nothing. Give each finding a file
          and line. Say plainly when the diff is sound; do not manufacture findings, and do
          not report style preferences the linter already owns.
          BRIEF

      - name: Post the review
        if: steps.credential.outputs.present == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One comment, edited in place: a review per push would bury the conversation.
          {
            echo "## Codex review"
            echo
            if [ -s review.md ]; then
              cat review.md
            else
              echo "_Codex could not complete this review. See the workflow run for details._"
            fi
            echo
            echo "<sub>Automated review of ${{ github.event.pull_request.head.sha }}. Advisory: it does not gate this merge.</sub>"
          } > comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file comment.md --edit-last --create-if-none
