name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run type check
        # `tsc --noEmit` alone is a no-op on the solution-style root tsconfig
        # (files: [] + references) and exits 0 even on broken code. `-b`
        # actually checks the referenced projects.
        run: npx tsc -b --noEmit

      - name: Run linter
        run: bun run lint
        continue-on-error: true

      # `bun test` is Bun's own runner: it ignores vitest.config, the jsdom
      # environment, src/test/setup.ts and the `@` alias, and it walks files the
      # vitest `include` pattern excludes (such as the Deno edge-function tests).
      # `bun run test` executes the package.json script, i.e. `vitest run`.
      - name: Run tests
        run: bun run test

      - name: Upload test results
        if: always()
        # Artifact storage quota exhaustion must never fail CI; results are diagnostics only.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            coverage/
            test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build application
        run: bun run build

      - name: Upload build artifacts
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: dist/
          retention-days: 7
